name: CI
on:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - synchronize
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Make room on the runner
        if: ${{ runner.os == 'Linux' }}
        run: .github/workflows/make_room.sh
      - name: Set up Bazelisk
        shell: bash
        run: |
          case "${RUNNER_OS}-${RUNNER_ARCH}" in
            Linux-X64) asset="bazelisk-linux-amd64"; sha256="5a408715e932c0250d28bd84555f12edbf70117de42f9181691c736eacc4a992" ;;
            Linux-ARM64) asset="bazelisk-linux-arm64"; sha256="e20e8b0f4f240091b7a55bf17b9398bd4f40ee70ae0208dff95dd4c445fb4010" ;;
            macOS-X64) asset="bazelisk-darwin-amd64"; sha256="16c3d7aa15323a9fb69f56c7ec5733ed18bedb786680d0ba13bb12a3c8083007" ;;
            macOS-ARM64) asset="bazelisk-darwin-arm64"; sha256="cee851f726789227d5561004e9904a52be45c3efb56f8b38b6993d6adbaa0409" ;;
            Windows-X64) asset="bazelisk-windows-amd64.exe"; sha256="092a8738d5b41aae7a85c42cc961b1034e3389aba43ffc20c0fabda7b43e095b" ;;
            *) echo "Unsupported runner: ${RUNNER_OS}-${RUNNER_ARCH}" >&2; exit 1 ;;
          esac
          bazelisk_dir="${RUNNER_TEMP//\\//}/bazelisk"
          mkdir -p "${bazelisk_dir}"
          executable=bazel
          if [[ "${RUNNER_OS}" == Windows ]]; then executable=bazel.exe; fi
          curl -fsSL "https://github.com/bazelbuild/bazelisk/releases/download/v1.29.0/${asset}" -o "${bazelisk_dir}/${executable}"
          if [[ "${RUNNER_OS}" == macOS ]]; then
            printf '%s  %s\n' "${sha256}" "${bazelisk_dir}/${executable}" | shasum -a 256 -c -
          else
            printf '%s  %s\n' "${sha256}" "${bazelisk_dir}/${executable}" | sha256sum -c -
          fi
          chmod +x "${bazelisk_dir}/${executable}"
          echo "${bazelisk_dir}" >> "${GITHUB_PATH}"
      - name: Run the tests
        run: bazel test //...
      - name: Analyze Ahab's own build
        if: ${{ !cancelled() && matrix.os == 'ubuntu-24.04' }}
        run: bazel run //:hermeticity
      - name: Prepare the binary for the module test
        if: ${{ !cancelled() }}
        run: |
          .github/workflows/build_ahab.sh "$RUNNER_TEMP/ahab-prebuilt/ahab"
          echo "AHAB_PREBUILT_LOCAL=$RUNNER_TEMP/ahab-prebuilt" >> "$GITHUB_ENV"
      - name: Check that Ahab can be consumed as a module
        if: ${{ !cancelled() }}
        working-directory: packaging
        run: |
          for version in "$(cat .bazelversion)" 8.7.0; do
            export USE_BAZEL_VERSION="$version"
            bazel build //:ahab.report //:ahab.check //:ahab.update //:ahab.explain
            bazel run //:ahab.report
            bazel run //:ahab.check
            bazel run //:ahab.explain
            bazel query 'deps(//...)' > /dev/null
          done
  fishery:
    name: Fishery ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Make room on the runner
        run: .github/workflows/make_room.sh
      - name: Set up Bazelisk
        shell: bash
        run: |
          bazelisk_dir="${RUNNER_TEMP}/bazelisk"
          mkdir -p "${bazelisk_dir}"
          curl -fsSL "https://github.com/bazelbuild/bazelisk/releases/download/v1.29.0/bazelisk-linux-amd64" -o "${bazelisk_dir}/bazel"
          printf '%s  %s\n' '5a408715e932c0250d28bd84555f12edbf70117de42f9181691c736eacc4a992' "${bazelisk_dir}/bazel" | sha256sum -c -
          chmod +x "${bazelisk_dir}/bazel"
          echo "${bazelisk_dir}" >> "${GITHUB_PATH}"
      - name: Run the fishery
        run: python3 fishery/fishery.py ci --shard=${{ matrix.shard }}/${{ strategy.job-total }}
