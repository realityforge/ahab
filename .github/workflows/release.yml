name: Release
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.2.3). Must already exist."
        type: string
        required: true
permissions:
  attestations: write
  contents: write
  id-token: write
jobs:
  binaries:
    name: Binary (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux_x86_64
            runner: ubuntu-24.04
            bazel_platform: "@rules_rs//rs/platforms:x86_64-unknown-linux-musl"
          - platform: linux_arm64
            runner: ubuntu-24.04-arm
            bazel_platform: "@rules_rs//rs/platforms:aarch64-unknown-linux-musl"
          - platform: darwin_arm64
            runner: macos-15
            bazel_platform: ""
          - platform: darwin_x86_64
            runner: macos-15-intel
            bazel_platform: ""
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Set up Bazelisk
        shell: bash
        run: |
          case "${RUNNER_OS}-${RUNNER_ARCH}" in
            Linux-X64) asset="bazelisk-linux-amd64"; sha256="5a408715e932c0250d28bd84555f12edbf70117de42f9181691c736eacc4a992" ;;
            Linux-ARM64) asset="bazelisk-linux-arm64"; sha256="e20e8b0f4f240091b7a55bf17b9398bd4f40ee70ae0208dff95dd4c445fb4010" ;;
            macOS-X64) asset="bazelisk-darwin-amd64"; sha256="16c3d7aa15323a9fb69f56c7ec5733ed18bedb786680d0ba13bb12a3c8083007" ;;
            macOS-ARM64) asset="bazelisk-darwin-arm64"; sha256="cee851f726789227d5561004e9904a52be45c3efb56f8b38b6993d6adbaa0409" ;;
            Windows-X64) asset="bazelisk-windows-amd64.exe"; sha256="092a8738d5b41aae7a85c42cc961b1034e3389aba43ffc20c0fabda7b43e095b" ;;
            *) echo "Unsupported runner: ${RUNNER_OS}-${RUNNER_ARCH}" >&2; exit 1 ;;
          esac
          bazelisk_dir="${RUNNER_TEMP//\\//}/bazelisk"
          mkdir -p "${bazelisk_dir}"
          executable=bazel
          if [[ "${RUNNER_OS}" == Windows ]]; then executable=bazel.exe; fi
          curl -fsSL "https://github.com/bazelbuild/bazelisk/releases/download/v1.29.0/${asset}" -o "${bazelisk_dir}/${executable}"
          if [[ "${RUNNER_OS}" == macOS ]]; then
            printf '%s  %s\n' "${sha256}" "${bazelisk_dir}/${executable}" | shasum -a 256 -c -
          else
            printf '%s  %s\n' "${sha256}" "${bazelisk_dir}/${executable}" | sha256sum -c -
          fi
          chmod +x "${bazelisk_dir}/${executable}"
          echo "${bazelisk_dir}" >> "${GITHUB_PATH}"
      - name: Build the binary
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          BAZEL_PLATFORM: ${{ matrix.bazel_platform }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -o errexit -o nounset -o pipefail
          flags=(--compilation_mode=opt)
          if [ -n "$BAZEL_PLATFORM" ]; then
            flags+=("--platforms=$BAZEL_PLATFORM")
          fi
          .github/workflows/build_ahab.sh dist/ahab "${flags[@]}"
          reported="$(./dist/ahab --version)"
          if [ "$reported" != "ahab ${TAG#v}" ]; then
            echo "binary reports \"$reported\", expected \"ahab ${TAG#v}\"" >&2
            exit 1
          fi
          COPYFILE_DISABLE=1 tar -czf "ahab-${TAG#v}-$PLATFORM.tar.gz" -C dist ahab
      - name: Upload the binary
        uses: actions/upload-artifact@v7
        with:
          name: ahab-${{ matrix.platform }}
          path: ahab-*.tar.gz
          if-no-files-found: error
  release:
    needs: binaries
    uses: bazel-contrib/.github/.github/workflows/release_ruleset.yaml@v7.7.0
    with:
      release_files: ahab-*.tar.gz
      prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
      tag_name: ${{ inputs.tag || github.ref_name }}
      bazel_test_command: "true"
  smoke:
    name: Smoke (${{ matrix.platform }})
    needs: [release]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux_x86_64
            runner: ubuntu-24.04
          - platform: linux_arm64
            runner: ubuntu-24.04-arm
          - platform: darwin_arm64
            runner: macos-15
          - platform: darwin_x86_64
            runner: macos-15-intel
    steps:
      - name: Set up Bazelisk
        shell: bash
        run: |
          case "${RUNNER_OS}-${RUNNER_ARCH}" in
            Linux-X64) asset="bazelisk-linux-amd64"; sha256="5a408715e932c0250d28bd84555f12edbf70117de42f9181691c736eacc4a992" ;;
            Linux-ARM64) asset="bazelisk-linux-arm64"; sha256="e20e8b0f4f240091b7a55bf17b9398bd4f40ee70ae0208dff95dd4c445fb4010" ;;
            macOS-X64) asset="bazelisk-darwin-amd64"; sha256="16c3d7aa15323a9fb69f56c7ec5733ed18bedb786680d0ba13bb12a3c8083007" ;;
            macOS-ARM64) asset="bazelisk-darwin-arm64"; sha256="cee851f726789227d5561004e9904a52be45c3efb56f8b38b6993d6adbaa0409" ;;
            Windows-X64) asset="bazelisk-windows-amd64.exe"; sha256="092a8738d5b41aae7a85c42cc961b1034e3389aba43ffc20c0fabda7b43e095b" ;;
            *) echo "Unsupported runner: ${RUNNER_OS}-${RUNNER_ARCH}" >&2; exit 1 ;;
          esac
          bazelisk_dir="${RUNNER_TEMP//\\//}/bazelisk"
          mkdir -p "${bazelisk_dir}"
          executable=bazel
          if [[ "${RUNNER_OS}" == Windows ]]; then executable=bazel.exe; fi
          curl -fsSL "https://github.com/bazelbuild/bazelisk/releases/download/v1.29.0/${asset}" -o "${bazelisk_dir}/${executable}"
          if [[ "${RUNNER_OS}" == macOS ]]; then
            printf '%s  %s\n' "${sha256}" "${bazelisk_dir}/${executable}" | shasum -a 256 -c -
          else
            printf '%s  %s\n' "${sha256}" "${bazelisk_dir}/${executable}" | sha256sum -c -
          fi
          chmod +x "${bazelisk_dir}/${executable}"
          echo "${bazelisk_dir}" >> "${GITHUB_PATH}"
      - name: Consume the release the way a consumer would
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -o errexit -o nounset -o pipefail
          version="${TAG#v}"
          mkdir -p smoke
          cd smoke
          cat > MODULE.bazel <<EOF
          module(name = "ahab_smoke", version = "0.0.0")

          bazel_dep(name = "ahab", version = "$version")

          archive_override(
              module_name = "ahab",
              strip_prefix = "ahab-$version",
              urls = ["https://github.com/mrkkrp/ahab/releases/download/$TAG/ahab-$version.tar.gz"],
          )
          EOF
          cat > BUILD.bazel <<'EOF'
          load("@ahab//:defs.bzl", "ahab")

          ahab(
              name = "hermeticity",
              label = "//...",
              no_fail = True,
          )
          EOF
          for attempt in 1 2 3; do
            if bazel run //:hermeticity; then
              exit 0
            fi
            echo "attempt $attempt failed, the release assets may still be settling" >&2
            bazel clean --expunge
            sleep 20
          done
          exit 1
  publish-to-bcr:
    needs: [release, smoke]
    # A prerelease is for exercising this pipeline, not for publishing: the
    # registry has no notion of one, and an entry there cannot be taken
    # back, only yanked. The tag carrying a `-` is what marks it, the same
    # test the release itself uses.
    if: ${{ !contains(inputs.tag || github.ref_name, '-') }}
    uses: bazel-contrib/publish-to-bcr/.github/workflows/publish.yaml@v1.5.0
    with:
      tag_name: ${{ inputs.tag || github.ref_name }}
      registry_fork: mrkkrp/bazel-central-registry
      attest: true
    permissions:
      attestations: write
      contents: write
      id-token: write
    secrets:
      publish_token: ${{ secrets.BCR_PUBLISH_TOKEN }}
